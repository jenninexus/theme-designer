<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Theme Designer · Brand palette examples</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; color: #edf0fa; background: #10111b; font: 15px/1.5 system-ui, sans-serif; }
main { width: min(1440px, 100% - 32px); margin: 36px auto 60px; }
h1 { margin: 0; font-size: clamp(2rem, 6vw, 3.2rem); letter-spacing: -.045em; }
h2, h3, p { margin: 0; }
header p, footer { color: #b0bbd0; }
a { color: #99deef; }
.views { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
.views a { display:inline-flex; align-items:center; min-height:36px; padding:0 12px; border:1px solid #545870; border-radius:999px; text-decoration:none; }
.views a:is(:hover, :focus-visible) { background:#242a42; }
.views [aria-current] { background:#242a42; color:#edf0fa; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 425px), 1fr)); gap: 16px; margin: 25px 0; }
.card { --harmony: linear-gradient(90deg,var(--a),var(--b),var(--c)); position: relative; min-width: 0; overflow: hidden; padding: 14px; background: #191b2b; border: 1px solid #363b54; border-radius: 17px; }
.card::before { content: ""; position: absolute; inset: 0 0 auto; height: 2px; background: var(--harmony); }
.card > header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.card h2 { font-size: 1rem; }
.faces { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.face { background: radial-gradient(ellipse at top right,color-mix(in srgb,var(--bg),var(--accent) 13%),var(--bg) 75%); color: var(--text); border: 1px solid color-mix(in srgb,var(--bg),var(--primary) 35%); padding: 11px; border-radius: 11px; box-shadow: inset 0 1px 0 color-mix(in srgb,var(--bg),var(--primary) 27%); }
.face small { font-weight: 650; }
.face h3 { margin-top: 6px; line-height: 1.2; color: var(--primary); }
.face p { font-size: .81rem; margin-top: 6px; }
.face strong { color: var(--secondary); font-size: .78rem; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
.button, .download, .social { display: inline-flex; align-items: center; justify-content: center; min-height: 34px; padding: 4px 8px; border: 1px solid currentColor; border-radius: 7px; font: 650 .75rem/1.3 system-ui; }
.button { color: var(--bg); background: var(--primary); box-shadow: 0 2px 10px color-mix(in srgb, var(--primary) 36%, transparent); }
.download { color: #cfddf6; background: transparent; cursor: pointer; }
.download:hover { background: #ffffff13; }
.social { color: white; background: var(--social); border-color: transparent; }
.social svg { width: 17px; height: 17px; }
.harmony { height: 5px; border-radius: 99px; margin-top: 12px; background: var(--harmony); box-shadow: 0 0 12px color-mix(in srgb,var(--a) 40%,transparent); }
footer { font-size: .86rem; }
@media (max-width: 360px) { .faces { grid-template-columns: 1fr; } }
</style>
<script src="palettes/brand-examples.js" defer></script>
<script src="preview.js" defer></script>
</head>
<body>
<main>
  <header><h1>Theme Designer</h1>
    <p>Compare light and dark brand examples, then download a palette to make your own.</p>
    <p>Inspired by the best of <a href="https://github.com/jenninexus/syn-themes">Syn Themes</a>. Try a download in <a href="https://github.com/jenninexus/pdf-designer">PDF Designer</a>.</p>
    <nav class="views" aria-label="Theme Designer views">
      <a href="#examples" aria-current="page">Palettes</a>
      <a href="docs/seed-network/index.html?focus=theme-designer&amp;from=theme">Seed network</a>
    </nav>
  </header>
  <div class="grid" id="examples"></div>
  <footer>Social marks illustrate platform colors. Find project icons at <a href="https://simpleicons.org/">Simple Icons</a>, <a href="https://lucide.dev/">Lucide</a>, or <a href="https://fontawesome.com/">Font Awesome</a>.</footer>
</main>
</body>
</html>
